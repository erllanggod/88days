name: maketr0uble

on:
  workflow_dispatch:
    inputs:
      finasu:
        description: FinaSU + SUSFS
        type: boolean
        default: false
      ksunext:
        description: KernelSU-Next + SUSFS
        type: boolean
        default: false
      vanilla:
        description: Vanilla
        type: boolean
        default: true
      bypasscharging:
        description: Bypass Charging
        type: boolean
        default: false
      droidspaces:
        description: Droidspaces
        type: boolean
        default: false
      nomount:
        description: NoMount
        type: boolean
        default: false
      clang:
        description: CFrontend
        type: choice
        options:
          - aosp
          - cbl
          - neutron
        default: aosp
      hz:
        description: TFreq
        type: choice
        options:
          - balance
          - performance
          - ultra
        default: balance
      lto:
        description: CBackend
        type: choice
        options:
          - none
          - thin
        default: none

permissions:
  contents: write
  actions: read

env:
  CBL_VERSION: latest
  CLANG_URL: https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android15-release/clang-r510928.tar.gz
  MAGISK_URL: https://github.com/topjohnwu/Magisk/releases/download/v27.0/Magisk-v27.0.apk
  KERNEL_REF: 13dbecdba4678e4264db264378a3e326e9da2e75

jobs:
  plan:
    name: plan
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        run: |
          v=()
          [ "${{ inputs.vanilla }}" = "true" ] && v+=(none)
          [ "${{ inputs.finasu }}" = "true" ] && v+=(finasu)
          [ "${{ inputs.ksunext }}" = "true" ] && v+=(ksunext)
          [ ${#v[@]} -gt 0 ] || { echo "no variant selected" >&2; exit 1; }
          r="$(printf '%s\n' "${v[@]}" | jq -R . | jq -sc .)"
          echo "matrix=$(jq -nc --argjson r "$r" --arg l "${{ inputs.lto }}" '{root: $r, lto: [$l]}')" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.root == 'none' && 'vanilla' || matrix.root }} (${{ matrix.lto == 'none' && 'no LTO' || matrix.lto }})
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Start timer
        run: echo "BUILD_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Checkout builder
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Find last successful build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/build.yml/runs?status=success&per_page=1" --jq '.workflow_runs[0].head_sha // empty' || true)"
          echo "CHANGELOG_BASE=$base" >> "$GITHUB_ENV"

      - name: Checkout kernel source (private)
        uses: actions/checkout@v4
        with:
          repository: erllanggod/qwerty
          ref: ${{ env.KERNEL_REF }}
          token: ${{ secrets.KMI_TOKEN }}
          path: .build/kernel-src
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout KMI reference material (private)
        uses: actions/checkout@v4
        with:
          repository: erllanggod/88days-KMI
          token: ${{ secrets.KMI_TOKEN }}
          path: .build/kmi
          fetch-depth: 1
          persist-credentials: false

      - name: Point the build at the KMI material
        run: |
          {
            echo "KMI_REF_TREE=$GITHUB_WORKSPACE/.build/kmi/kmi-ref"
            echo "KMI_REF_SYSTEM_TREE=$GITHUB_WORKSPACE/.build/kmi/kmi-ref-system"
            echo "STOCK_SYMVERS=$GITHUB_WORKSPACE/.build/kmi/stock/stock.symvers"
            echo "CLANG_DIR=$GITHUB_WORKSPACE/.build/clang"
          } >> "$GITHUB_ENV"
          test "$(find .build/kmi/kmi-ref .build/kmi/kmi-ref-system -name '*.ko' | wc -l)" -ge 900
          test "$(wc -l < .build/kmi/stock/stock.symvers)" -eq 9090

      - name: Install dependencies
        run: .github/runner/deps.sh

      - name: Fetch Android clang r510928
        if: inputs.clang == 'aosp'
        run: prep/aosp.sh .build/clang

      - name: Fetch ClangBuiltLinux clang
        if: inputs.clang == 'cbl'
        run: prep/cbl.sh .build/clang

      - name: Fetch Neutron clang (latest)
        if: inputs.clang == 'neutron'
        run: prep/neutron.sh .build/clang

      - name: Fetch arm64 AnyKernel tools (magiskboot, busybox, magiskpolicy)
        run: .github/runner/tools.sh

      - name: Resolve build tag
        run: |
          flags=""; tag="vanilla"
          if [ "${{ inputs.bypasscharging }}" = "true" ]; then
            flags="$flags --bypasscharging"; tag="$tag-bypasscharging"
          fi
          if [ "${{ inputs.droidspaces }}" = "true" ]; then
            flags="$flags --droidspaces"; tag="$tag-droidspaces"
          fi
          if [ "${{ inputs.nomount }}" = "true" ]; then
            flags="$flags --nomount"; tag="$tag-nomount"
          fi
          if [ "${{ inputs.hz }}" != "balance" ]; then
            flags="$flags --hz ${{ inputs.hz }}"; tag="$tag-${{ inputs.hz }}"
          fi
          if [ "${{ matrix.lto }}" != "none" ]; then
            flags="$flags --lto ${{ matrix.lto }}"; tag="$tag-${{ matrix.lto }}"
          fi
          if [ "${{ matrix.root }}" != "none" ]; then
            flags="$flags --root ${{ matrix.root }}"; tag="$tag-${{ matrix.root }}"
          fi
          echo "CLANG_FAMILY=${{ inputs.clang }}" >> "$GITHUB_ENV"
          echo "BUILD_FLAGS=$flags" >> "$GITHUB_ENV"
          echo "BUILD_TAG=$tag" >> "$GITHUB_ENV"

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: .build/ccache
          key: ccache-${{ inputs.clang }}-${{ matrix.lto }}-${{ github.run_id }}-${{ matrix.root }}
          restore-keys: |
            ccache-${{ inputs.clang }}-${{ matrix.lto }}-

      - name: Scout newest root and SUSFS commits
        if: matrix.root != 'none'
        run: .github/runner/scout.sh ${{ matrix.root }}

      - name: Build + KMI gates
        id: build
        env:
          KOUT: ${{ github.workspace }}/.build/out
        run: ./build.sh vanilla $BUILD_FLAGS

      - name: Record scout result
        if: always() && matrix.root != 'none' && (steps.build.outcome == 'success' || steps.build.outcome == 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/runner/checkpoint.sh ${{ steps.build.outcome }}

      - name: Trim and save ccache
        if: always()
        run: ccache --cleanup 2>/dev/null || true
        env:
          CCACHE_DIR: ${{ github.workspace }}/.build/ccache

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .build/ccache
          key: ccache-${{ inputs.clang }}-${{ matrix.lto }}-${{ github.run_id }}-${{ matrix.root }}

      - name: Package AnyKernel3 zip
        run: release/package.sh "$BUILD_TAG"

      - name: Post to Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.GRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: release/telegram/post.sh "$BUILD_TAG"
