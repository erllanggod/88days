# device.conf — single source of truth for Xiaomi POCO F7 / Redmi Turbo 4 Pro (onyx)
# Sourced by build.sh, package.sh, and test/*-selftest.sh.

PROJ="${PROJ:-$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)}"

DEVICE_LABEL="Poco F7"
DEVICE_FULL_LABEL="Xiaomi POCO F7 / Redmi Turbo 4 Pro (onyx)"
DEVICE_SOC="Qualcomm Snapdragon 8s Gen 4 (SM8735 / qcom,tuna)"
DEVICE_CODENAME="onyx"
# do.devicecheck=0 in AnyKernel3 so both POCO F7 (onyx_global/onyx) and Redmi Turbo 4 Pro (onyx) flash without mismatch
DEVICE_NAMES="onyx onyx_global"
DEVICE_CHECK=0

# Firmware baseline (OS3.0.303.0.WOLMIXM, HyperOS 3 / Android 16)
STOCK_FIRMWARE="OS3.0.303.0.WOLMIXM"
STOCK_UNAME="6.6.118-android15-8-ge56cf6b09cca-ab15511674-4k"

# Kernel image & boot.img layout (Header v4, 4096-byte page size, raw uncompressed arm64 Image)
KERNEL_FMT="raw"
BOOT_HEADER_VER=4
BOOT_PAGESIZE=4096

# Release branding -> uname -r: 6.6.162-DumpC2J
BRAND="DumpC2J"
BRAND_FULL="DumpC2J Custom GKI"
KERNEL_BRAND="DumpC2J"
KBUILD_BUILD_USER="adennnqt"
KBUILD_BUILD_HOST="DumpC2J"

# Paths
STOCK_BOOT_IMG="${STOCK_BOOT_IMG:-$PROJ/boot.img}"
KERNEL_SRC="${KERNEL_SRC:-$PROJ/.build/kernel-src}"
KMI_REF_TREE="${KMI_REF_TREE:-$PROJ/.build/kmi-ref}"
KMI_REF_SYSTEM_TREE="${KMI_REF_SYSTEM_TREE:-$PROJ/.build/kmi-ref-system}"
STOCK_SYMVERS="${STOCK_SYMVERS:-$PROJ/.build/stock/stock.symvers}"
STOCK_KERNEL="${STOCK_KERNEL:-$PROJ/.build/stock/kernel}"
CLANG_DIR="${CLANG_DIR:-$PROJ/.build/clang}"

# KMI / Modversions baseline invariants
MODULE_LAYOUT="0x4e276f37"
KMI_EXPECT_VERMAGIC="6.6.57-android15-8"
KMI_SYSTEM_EXPECT_VERMAGIC="6.6.118-android15-8-ge56cf6b09cca-ab15511674-4k"
KMI_VENDOR_KO_COUNT=827
KMI_SYSTEM_KO_COUNT=96
KMI_STOCK_SYMVERS_COUNT=9090
